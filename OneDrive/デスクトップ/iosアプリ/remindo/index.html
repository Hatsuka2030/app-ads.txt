<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>reminDO — 忘れない記憶術</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="reminDO">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface2: #faf8f5;
  --border: #e8e3db;
  --text: #1a1814;
  --text2: #6b655a;
  --text3: #a09890;
  --accent: #2d6a4f;
  --accent-light: #d8f3dc;
  --accent2: #e76f51;
  --accent2-light: #fde8e2;
  --warn-light: #fef0e1;
  --shadow: 0 2px 12px rgba(26,24,20,0.07);
  --shadow-lg: 0 8px 32px rgba(26,24,20,0.14);
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 68px;
  --header-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  touch-action: manipulation;
}

/* APP SHELL */
.app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }

/* HEADER */
header {
  flex-shrink: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 50;
  box-shadow: var(--shadow);
}
.logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--accent); }
.logo span { color: var(--accent2); }

/* SCROLL AREA */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  z-index: 50;
  box-shadow: 0 -4px 20px rgba(26,24,20,0.08);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 4px 0;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text3);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  font-weight: 500;
  transition: color 0.15s;
  position: relative;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-badge {
  position: absolute;
  top: 6px;
  right: calc(50% - 20px);
  background: var(--accent2);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 20px;
  min-width: 18px;
  text-align: center;
}

/* PAGES */
.page { display: none; padding: 20px 16px; }
.page.active { display: block; }
.page-review { display: none; flex-direction: column; height: 100%; }
.page-review.active { display: flex; }

.page-title { font-family: 'DM Serif Display', serif; font-size: 24px; margin-bottom: 4px; }
.page-sub { color: var(--text2); font-size: 13px; margin-bottom: 20px; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: var(--radius-sm); border: none;
  font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:active { background: #245a41; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-full { width: 100%; padding: 14px; font-size: 15px; border-radius: var(--radius); }
.btn-icon {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* TODAY BANNER */
.today-banner {
  background: linear-gradient(135deg, var(--accent) 0%, #1b4332 100%);
  color: white; border-radius: var(--radius); padding: 20px;
  margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
}
.today-banner h3 { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 3px; }
.today-banner p { font-size: 12px; opacity: 0.8; margin-bottom: 14px; }
.today-count { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; }
.btn-start {
  background: rgba(255,255,255,0.2); color: white;
  border: 1.5px solid rgba(255,255,255,0.5); border-radius: 10px;
  padding: 9px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}

/* ITEM CARDS */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px;
  display: flex; align-items: flex-start; gap: 12px; box-shadow: var(--shadow);
}
.item-icon {
  width: 42px; height: 42px; border-radius: 12px; background: var(--accent-light);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.item-body { flex: 1; min-width: 0; }
.item-front { font-weight: 700; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-back { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.item-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: var(--accent-light); color: var(--accent); }
.badge-orange { background: var(--warn-light); color: #b45309; }
.badge-gray { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

/* STATS */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; box-shadow: var(--shadow); }
.stat-num { font-family: 'DM Serif Display', serif; font-size: 34px; color: var(--accent); line-height: 1; }
.stat-label { font-size: 11px; color: var(--text2); margin-top: 4px; font-weight: 500; }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }

/* FORM */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
.form-input, .form-textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px; color: var(--text); background: var(--surface);
  outline: none; transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }

/* FILTER */
.filter-row {
  display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
  margin-bottom: 14px; padding-bottom: 4px; -webkit-overflow-scrolling: touch;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  white-space: nowrap; padding: 6px 14px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text2); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif; flex-shrink: 0;
}
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

/* STAGE BAR */
.stage-bar { display: flex; gap: 4px; align-items: center; margin-top: 8px; }
.stage-pip { flex: 1; height: 5px; border-radius: 3px; background: var(--border); }
.stage-pip.done { background: var(--accent); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
.empty-icon { font-size: 48px; margin-bottom: 14px; }
.empty-state h3 { font-size: 17px; color: var(--text); margin-bottom: 8px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* MODAL (bottom sheet) */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(26,24,20,0.5);
  z-index: 200; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  width: 100%;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 18px; }

/* REVIEW SCREEN */
.review-header {
  flex-shrink: 0; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.review-prog-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.review-prog-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }
.review-counter { font-size: 12px; color: var(--text3); white-space: nowrap; font-weight: 600; }

.review-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 16px; gap: 20px; overflow: hidden;
}

/* FLIP CARD */
.flip-wrap { width: 100%; max-width: 420px; perspective: 1000px; }
.flip-card {
  width: 100%; min-height: 260px; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4,0.2,0.2,1);
  cursor: pointer;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-front, .flip-back {
  position: absolute; inset: 0; min-height: 260px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 24px; text-align: center;
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
}
.flip-front { background: var(--surface); }
.flip-back { background: var(--accent-light); transform: rotateY(180deg); }
.flip-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 14px; }
.flip-content { font-size: 22px; font-weight: 700; line-height: 1.4; color: var(--text); }
.flip-hint { margin-top: 18px; font-size: 12px; color: var(--text3); }

/* ANSWER BUTTONS */
.review-actions { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
.review-tap-hint { text-align: center; font-size: 13px; color: var(--text3); }
.answer-row { display: flex; gap: 10px; }
.btn-remember {
  flex: 1; padding: 16px; background: var(--accent); color: white;
  border: none; border-radius: var(--radius);
  font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.btn-remember:active { background: #245a41; transform: scale(0.98); }
.btn-forgot {
  flex: 1; padding: 16px; background: var(--accent2-light); color: var(--accent2);
  border: 1.5px solid var(--accent2); border-radius: var(--radius);
  font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.btn-forgot:active { background: #fcd0c0; transform: scale(0.98); }
.btn-back-to-q {
  width: 100%; padding: 12px; background: none;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--text2); cursor: pointer;
}
.btn-back-to-q:active { background: var(--surface2); }

/* COMPLETE SCREEN */
.complete-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px; gap: 12px;
}
.complete-emoji { font-size: 64px; }
.complete-screen h2 { font-family: 'DM Serif Display', serif; font-size: 26px; }
.complete-screen p { color: var(--text2); font-size: 14px; line-height: 1.6; }

/* MISC */
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.text-muted { color: var(--text3); font-size: 12px; }
.mb-12 { margin-bottom: 12px; }
.section-title { font-weight: 700; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">remindo<span>.</span></div>
    <button class="btn btn-primary" style="padding:8px 16px;font-size:13px" onclick="openAddModal()">＋ 追加</button>
  </header>

  <div class="scroll-area" id="scroll-area">

    <!-- TODAY -->
    <div class="page active" id="page-today">
      <div id="today-banner-area"></div>
      <div class="section-title">今日の復習リスト</div>
      <div id="today-list"></div>
    </div>

    <!-- REVIEW (full-height) -->
    <div class="page-review" id="page-review">
      <div class="review-header">
        <button class="btn-icon" onclick="endReview()" style="font-size:18px">←</button>
        <div class="review-prog-wrap"><div class="review-prog-bar" id="review-prog"></div></div>
        <span class="review-counter" id="review-counter"></span>
      </div>
      <div class="review-body" id="review-body-area"></div>
    </div>

    <!-- LEARNING -->
    <div class="page" id="page-learning">
      <div class="page-title">学習中</div>
      <p class="page-sub">次回の復習待ちアイテム</p>
      <div id="learning-content"></div>
    </div>

    <!-- COMPLETED -->
    <div class="page" id="page-completed">
      <div class="page-title">完了</div>
      <p class="page-sub">記憶に定着したアイテム</p>
      <div id="completed-content"></div>
    </div>

    <!-- ALL -->
    <div class="page" id="page-all">
      <div class="flex-between mb-12">
        <div class="page-title">すべて</div>
        <button class="btn btn-primary" style="padding:8px 14px;font-size:13px" onclick="openAddModal()">＋</button>
      </div>
      <div class="filter-row" id="all-filters"></div>
      <div id="all-content"></div>
    </div>

    <!-- STATS -->
    <div class="page" id="page-stats">
      <div class="page-title">統計</div>
      <p class="page-sub">学習状況のまとめ</p>
      <div id="stats-content"></div>
    </div>

    <!-- IMPORT -->
    <div class="page" id="page-import">
      <div class="page-title">インポート</div>
      <p class="page-sub">CSVから単語を一括登録できます</p>

      <!-- STEP 1 -->
      <div id="import-step1">
        <div class="card">
          <div style="font-weight:700;font-size:14px;margin-bottom:8px">① テキストを貼り付け</div>
          <p style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px">
            1行1アイテム、<strong>表,裏</strong> の順にカンマ区切りで入力します。裏は省略可。
          </p>
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;font-family:monospace;color:var(--text3);margin-bottom:12px;line-height:1.9">
            Serendipity,偶然の幸運な発見<br>
            間隔反復法,最適なタイミングで復習する方法<br>
            光合成
          </div>
          <textarea class="form-textarea" id="import-text" rows="6" placeholder="ここに貼り付けてください…"></textarea>
        </div>
        <div class="card" style="text-align:center">
          <div style="font-weight:700;font-size:14px;margin-bottom:10px">① ファイルから読み込む</div>
          <label style="display:block;background:var(--accent-light);border:2px dashed var(--accent);border-radius:12px;padding:20px;cursor:pointer">
            <input type="file" id="import-file" accept=".csv,.txt" style="display:none" onchange="loadCSVFile(event)">
            <div style="font-size:32px;margin-bottom:4px">📂</div>
            <div style="font-weight:700;color:var(--accent);font-size:13px">.csv / .txt を選択</div>
          </label>
        </div>
        <button class="btn btn-primary btn-full" onclick="previewImport()">次へ → プレビュー確認</button>
      </div>

      <!-- STEP 2: PREVIEW + CATEGORY -->
      <div id="import-step2" style="display:none">
        <div class="card">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px">② カテゴリをまとめて設定（任意）</div>
          <p style="font-size:12px;color:var(--text2);margin-bottom:10px">全件に同じカテゴリを適用します。空欄のままでもOK。</p>
          <input class="form-input" id="import-tag" placeholder="例：英単語、歴史、プログラミング" maxlength="30">
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="font-weight:700;font-size:14px">③ プレビュー</div>
            <span id="import-count-label" style="font-size:12px;color:var(--text2)"></span>
          </div>
          <div id="import-preview-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-secondary" style="flex:1;padding:14px" onclick="resetImport()">← 戻る</button>
          <button class="btn btn-primary" style="flex:2;padding:14px;font-size:15px" onclick="confirmImport()">✅ インポートする</button>
        </div>
      </div>

      <!-- STEP 3: DONE -->
      <div id="import-step3" style="display:none;text-align:center;padding:40px 0">
        <div style="font-size:56px;margin-bottom:12px">🎉</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px">インポート完了！</div>
        <p id="import-done-msg" style="color:var(--text2);font-size:14px;margin-bottom:24px"></p>
        <button class="btn btn-primary btn-full" onclick="showPage('today',document.getElementById('nav-today'))">ホームへ戻る</button>
        <button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="resetImport()">続けてインポート</button>
      </div>

      <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">
        <div style="font-weight:700;font-size:13px;color:var(--text2);margin-bottom:10px">エクスポート</div>
        <button class="btn btn-secondary btn-full" style="margin-bottom:8px" onclick="exportCSV()">📊 CSVでエクスポート</button>
        <button class="btn btn-secondary btn-full" onclick="exportJSON()">💾 JSONでエクスポート（フルバックアップ）</button>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-today" onclick="showPage('today',this)">
      <span class="nav-icon">📅</span><span>今日</span>
      <span class="nav-badge" id="nav-badge-today" style="display:none">0</span>
    </button>
    <button class="nav-item" id="nav-learning" onclick="showPage('learning',this)">
      <span class="nav-icon">📖</span><span>学習中</span>
      <span class="nav-badge" id="nav-badge-learning" style="display:none">0</span>
    </button>
    <button class="nav-item" id="nav-completed" onclick="showPage('completed',this)">
      <span class="nav-icon">✅</span><span>完了</span>
    </button>
    <button class="nav-item" id="nav-all" onclick="showPage('all',this)">
      <span class="nav-icon">🗂️</span><span>すべて</span>
    </button>
    <button class="nav-item" id="nav-import" onclick="showPage('import',this)">
      <span class="nav-icon">📥</span><span>取込</span>
    </button>
  </nav>

</div>

<!-- MODAL (bottom sheet) -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">新しいアイテムを追加</div>
    <div class="form-group">
      <label class="form-label">表（覚えたいこと）*</label>
      <input class="form-input" id="input-front" placeholder="例：Serendipity" maxlength="200">
    </div>
    <div class="form-group">
      <label class="form-label">裏（答え・解説）</label>
      <textarea class="form-textarea" id="input-back" placeholder="例：偶然の幸運な発見" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">カテゴリ（任意）</label>
      <input class="form-input" id="input-tag" placeholder="例：英単語" maxlength="30">
    </div>
    <button class="btn btn-primary btn-full" onclick="saveItem()" id="save-btn">保存する</button>
    <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<script>
const STAGES = [1,3,7,14,30];
const STAGE_LABELS = ['翌日','3日後','7日後','14日後','30日後'];
const ICONS = ['📗','📘','📙','📕','📒','🗒️','📝','💡','⭐','🔑'];

let items = JSON.parse(localStorage.getItem('remindo_items')||'[]');
let editingId = null;
let reviewQueue = [], reviewIdx = 0, reviewFlipped = false;
let currentFilter = 'all';

function save() { localStorage.setItem('remindo_items', JSON.stringify(items)); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function daysDiff(ds) {
  const d=new Date(ds),n=new Date();
  d.setHours(0,0,0,0); n.setHours(0,0,0,0);
  return Math.floor((n-d)/86400000);
}
function isDueToday(item) {
  if (item.completed) return false;
  if (!item.nextReview) return true;
  return item.nextReview <= todayStr();
}
function getIcon(item) {
  const h=(item.front||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  return ICONS[h%ICONS.length];
}
function getStageBadge(item) {
  if (item.completed) return '<span class="badge badge-green">✓ 完了</span>';
  const s=item.stage||0;
  if (s===0) return '<span class="badge badge-orange">🆕 新規</span>';
  return `<span class="badge badge-gray">第${s}段階</span>`;
}
function getNextLabel(item) {
  if (!item.nextReview) return '今日';
  const diff=-(daysDiff(item.nextReview));
  if (diff<=0) return '今日';
  if (diff===1) return '明日';
  return `${diff}日後`;
}
function stageBarHTML(item) {
  const s=item.stage||0;
  return `<div class="stage-bar">${STAGES.map((_,i)=>`<div class="stage-pip${i<s?' done':''}"></div>`).join('')}<span style="font-size:10px;color:var(--text3);margin-left:4px">${s}/5</span></div>`;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// NAV
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-review').classList.remove('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const pg=document.getElementById('page-'+name);
  if (pg) pg.classList.add('active');
  if (el) el.classList.add('active');
  document.getElementById('scroll-area').scrollTop=0;
  renderPage(name);
}
function renderPage(name) {
  updateBadges();
  if (name==='today') renderToday();
  if (name==='learning') renderLearning();
  if (name==='completed') renderCompleted();
  if (name==='all') renderAll();
  if (name==='stats') renderStats();
}
function updateBadges() {
  const tc=items.filter(isDueToday).length;
  const tb=document.getElementById('nav-badge-today');
  tb.textContent=tc; tb.style.display=tc?'':'none';
  const lc=items.filter(i=>!i.completed&&(i.stage||0)>0&&!isDueToday(i)).length;
  const lb=document.getElementById('nav-badge-learning');
  lb.textContent=lc; lb.style.display=lc?'':'none';
}

// TODAY
function renderToday() {
  const due=items.filter(isDueToday);
  const bannerEl=document.getElementById('today-banner-area');
  const listEl=document.getElementById('today-list');
  if (!due.length) {
    bannerEl.innerHTML='';
    listEl.innerHTML=`<div class="empty-state"><div class="empty-icon">🎉</div><h3>今日の復習は完了！</h3><p>次の復習が来るまでゆっくりしてください。</p><br><button class="btn btn-primary" onclick="openAddModal()">＋ アイテムを追加</button></div>`;
    return;
  }
  bannerEl.innerHTML=`<div class="today-banner"><div><h3>今日の復習</h3><p>忘れる前に片付けましょう</p><button class="btn-start" onclick="startReview()">▶ 復習を開始</button></div><div class="today-count">${due.length}</div></div>`;
  listEl.innerHTML=`<div class="item-list">${due.map(itemCardHTML).join('')}</div>`;
}
function itemCardHTML(item) {
  return `<div class="item-card">
    <div class="item-icon">${getIcon(item)}</div>
    <div class="item-body">
      <div class="item-front">${esc(item.front)}</div>
      ${item.back?`<div class="item-back">${esc(item.back)}</div>`:''}
      <div class="item-meta">${getStageBadge(item)}${item.tag?`<span class="badge badge-gray">🏷 ${esc(item.tag)}</span>`:''}</div>
    </div>
    <div class="item-actions">
      <button class="btn-icon" onclick="openEditModal('${item.id}')">✏️</button>
      <button class="btn-icon" onclick="deleteItem('${item.id}')">🗑️</button>
    </div>
  </div>`;
}

// REVIEW
function startReview() {
  reviewQueue=items.filter(isDueToday).map(i=>i.id);
  reviewIdx=0;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-review').classList.add('active');
  document.getElementById('scroll-area').scrollTop=0;
  renderReviewCard();
}
function renderReviewCard() {
  const total=reviewQueue.length;
  const pct=total>0?(reviewIdx/total*100):100;
  document.getElementById('review-prog').style.width=pct+'%';
  document.getElementById('review-counter').textContent=`${Math.min(reviewIdx+1,total)} / ${total}`;
  if (reviewIdx>=total) { renderReviewComplete(total); return; }
  const item=items.find(i=>i.id===reviewQueue[reviewIdx]);
  if (!item) { reviewIdx++; renderReviewCard(); return; }
  reviewFlipped=false;
  document.getElementById('review-body-area').innerHTML=`
    <div class="flip-wrap">
      <div class="flip-card" id="flip-card" onclick="flipCard()">
        <div class="flip-front">
          <div class="flip-label">おぼえてる？</div>
          <div class="flip-content">${esc(item.front)}</div>
          ${item.tag?`<span class="badge badge-gray" style="margin-top:14px">🏷 ${esc(item.tag)}</span>`:''}
          <div class="flip-hint">👆 タップして答えを確認</div>
        </div>
        <div class="flip-back">
          <div class="flip-label">こたえ</div>
          <div class="flip-content">${item.back?esc(item.back):esc(item.front)}</div>
          ${stageBarHTML(item)}
        </div>
      </div>
    </div>
    <div class="review-actions">
      <div class="review-tap-hint" id="tap-hint">カードをタップして答えを確認してください</div>
      <div class="answer-row" id="answer-row" style="display:none">
        <button class="btn-forgot" onclick="answerReview(false)">😅 覚え直し</button>
        <button class="btn-remember" onclick="answerReview(true)">✅ 覚えた！</button>
      </div>
      <button class="btn-back-to-q" id="btn-back-q" style="display:none" onclick="unflipCard()">↩ 問題に戻る</button>
    </div>`;
}
function flipCard() {
  if (reviewFlipped) return;
  reviewFlipped=true;
  document.getElementById('flip-card').classList.add('flipped');
  document.getElementById('tap-hint').style.display='none';
  document.getElementById('answer-row').style.display='flex';
  document.getElementById('btn-back-q').style.display='block';
}
function unflipCard() {
  reviewFlipped=false;
  document.getElementById('flip-card').classList.remove('flipped');
  document.getElementById('tap-hint').style.display='block';
  document.getElementById('answer-row').style.display='none';
  document.getElementById('btn-back-q').style.display='none';
}
function answerReview(remembered) {
  const id=reviewQueue[reviewIdx];
  const item=items.find(i=>i.id===id);
  if (item) {
    if (remembered) {
      const ns=(item.stage||0)+1;
      if (ns>STAGES.length) { item.completed=true; item.stage=STAGES.length; item.nextReview=null; }
      else { item.stage=ns; const d=new Date(); d.setDate(d.getDate()+STAGES[ns-1]); item.nextReview=d.toISOString().slice(0,10); item.completed=false; }
    } else { item.stage=0; item.nextReview=todayStr(); item.completed=false; }
    item.lastReviewed=todayStr(); save();
  }
  reviewIdx++; renderReviewCard();
}
function renderReviewComplete(total) {
  document.getElementById('review-prog').style.width='100%';
  document.getElementById('review-counter').textContent='';
  document.getElementById('review-body-area').innerHTML=`
    <div class="complete-screen">
      <div class="complete-emoji">🎉</div>
      <h2>復習完了！</h2>
      <p>${total}件の復習おつかれさまでした。<br>この調子で続けましょう！</p>
      <button class="btn btn-primary btn-full" style="max-width:280px;margin-top:12px" onclick="endReview()">ホームに戻る</button>
    </div>`;
}
function endReview() {
  document.getElementById('page-review').classList.remove('active');
  showPage('today', document.getElementById('nav-today'));
}

// LEARNING
function renderLearning() {
  const list=items.filter(i=>!i.completed&&(i.stage||0)>0&&!isDueToday(i));
  const el=document.getElementById('learning-content');
  if (!list.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">📖</div><h3>学習中のアイテムがありません</h3><p>アイテムを追加すると復習待ちがここに表示されます。</p></div>`; return; }
  el.innerHTML=`<div class="item-list">${list.map(item=>`<div class="item-card">
    <div class="item-icon">${getIcon(item)}</div>
    <div class="item-body">
      <div class="item-front">${esc(item.front)}</div>
      ${item.back?`<div class="item-back">${esc(item.back)}</div>`:''}
      <div class="item-meta">${getStageBadge(item)}<span class="badge badge-orange">⏰ ${getNextLabel(item)}</span>${item.tag?`<span class="badge badge-gray">🏷 ${esc(item.tag)}</span>`:''}</div>
      ${stageBarHTML(item)}
    </div>
    <div class="item-actions">
      <button class="btn-icon" onclick="openEditModal('${item.id}')">✏️</button>
      <button class="btn-icon" onclick="deleteItem('${item.id}')">🗑️</button>
    </div>
  </div>`).join('')}</div>`;
}

// COMPLETED
function renderCompleted() {
  const list=items.filter(i=>i.completed);
  const el=document.getElementById('completed-content');
  if (!list.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏆</div><h3>まだ完了したアイテムがありません</h3><p>全5段階の復習を終えるとここに表示されます。</p></div>`; return; }
  el.innerHTML=`<div class="item-list">${list.map(item=>`<div class="item-card">
    <div class="item-icon">${getIcon(item)}</div>
    <div class="item-body">
      <div class="item-front">${esc(item.front)}</div>
      ${item.back?`<div class="item-back">${esc(item.back)}</div>`:''}
      <div class="item-meta"><span class="badge badge-green">✓ 記憶に定着</span>${item.tag?`<span class="badge badge-gray">🏷 ${esc(item.tag)}</span>`:''}</div>
    </div>
    <div class="item-actions">
      <button class="btn-icon" title="再学習" onclick="resetItem('${item.id}')">🔄</button>
      <button class="btn-icon" onclick="deleteItem('${item.id}')">🗑️</button>
    </div>
  </div>`).join('')}</div>`;
}

// ALL
function renderAll() {
  const tags=[...new Set(items.map(i=>i.tag).filter(Boolean))];
  document.getElementById('all-filters').innerHTML=
    `<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">すべて</button>`+
    tags.map(t=>`<button class="filter-btn ${currentFilter===t?'active':''}" onclick="setFilter('${esc(t)}')">${esc(t)}</button>`).join('');
  const filtered=currentFilter==='all'?items:items.filter(i=>i.tag===currentFilter);
  const el=document.getElementById('all-content');
  if (!filtered.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><h3>アイテムがありません</h3><p>右上の「＋」から覚えたいことを登録しましょう。</p></div>`; return; }
  el.innerHTML=`<div class="item-list">${filtered.map(itemCardHTML).join('')}</div>`;
}
function setFilter(f){ currentFilter=f; renderAll(); }

// STATS
function renderStats() {
  const total=items.length, completed=items.filter(i=>i.completed).length,
        dueToday=items.filter(isDueToday).length,
        learning=items.filter(i=>!i.completed&&(i.stage||0)>0).length;
  const tags=[...new Set(items.map(i=>i.tag).filter(Boolean))];
  document.getElementById('stats-content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">総アイテム</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--accent2)">${dueToday}</div><div class="stat-label">今日の復習</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#b45309">${learning}</div><div class="stat-label">学習中</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${completed}</div><div class="stat-label">記憶に定着</div></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-bottom:12px">忘却曲線（5段階）</div>
      <p style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px">1日後→3日後→7日後→14日後→30日後の計5回の復習で記憶に定着させます。</p>
      <div style="display:flex;gap:6px;align-items:flex-end;height:70px">
        ${STAGES.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="flex:1;width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:${0.35+i*0.15};min-height:${18+i*9}px"></div>
          <div style="font-size:9px;color:var(--text3);white-space:nowrap">${STAGE_LABELS[i]}</div>
        </div>`).join('')}
      </div>
    </div>
    ${tags.length?`<div class="card"><div class="section-title" style="margin-bottom:12px">カテゴリ別</div>
      ${tags.map(tag=>{const c=items.filter(i=>i.tag===tag).length,pct=total?Math.round(c/total*100):0;return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:500">🏷 ${esc(tag)}</span><span class="text-muted">${c}件</span></div>
        <div style="height:6px;background:var(--border);border-radius:3px"><div style="height:6px;background:var(--accent);border-radius:3px;width:${pct}%"></div></div>
      </div>`;}).join('')}
    </div>`:''}`;
}

// MODAL
function openAddModal() {
  editingId=null;
  document.getElementById('modal-title').textContent='新しいアイテムを追加';
  document.getElementById('input-front').value='';
  document.getElementById('input-back').value='';
  document.getElementById('input-tag').value='';
  document.getElementById('save-btn').textContent='保存する';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('input-front').focus(),300);
}
function openEditModal(id) {
  const item=items.find(i=>i.id===id); if (!item) return;
  editingId=id;
  document.getElementById('modal-title').textContent='アイテムを編集';
  document.getElementById('input-front').value=item.front||'';
  document.getElementById('input-back').value=item.back||'';
  document.getElementById('input-tag').value=item.tag||'';
  document.getElementById('save-btn').textContent='更新する';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('input-front').focus(),300);
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function saveItem() {
  const front=document.getElementById('input-front').value.trim();
  const back=document.getElementById('input-back').value.trim();
  const tag=document.getElementById('input-tag').value.trim();
  if (!front){ document.getElementById('input-front').style.borderColor='var(--accent2)'; document.getElementById('input-front').focus(); return; }
  document.getElementById('input-front').style.borderColor='';
  if (editingId) { const item=items.find(i=>i.id===editingId); if(item){item.front=front;item.back=back;item.tag=tag;} }
  else items.unshift({id:Date.now().toString(),front,back,tag,stage:0,nextReview:null,completed:false,createdAt:todayStr(),lastReviewed:null});
  save(); closeModal();
  const ap=document.querySelector('.page.active');
  if(ap) renderPage(ap.id.replace('page-',''));
}
function deleteItem(id) {
  if(!confirm('このアイテムを削除しますか？')) return;
  items=items.filter(i=>i.id!==id); save();
  const ap=document.querySelector('.page.active');
  if(ap) renderPage(ap.id.replace('page-',''));
}
function resetItem(id) {
  const item=items.find(i=>i.id===id); if(!item) return;
  item.stage=0; item.nextReview=null; item.completed=false; save(); renderCompleted();
}

// ========== IMPORT / EXPORT ==========
let importParsed = []; // holds parsed rows before confirm

function parseCSVText(text) {
  return text.split('
')
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .map(line => {
      // Handle quoted fields
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur);
      return { front: (cols[0]||'').trim(), back: (cols[1]||'').trim() };
    })
    .filter(r => r.front.length > 0);
}

function loadCSVFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('import-text').value = e.target.result;
  };
  reader.readAsText(file, 'UTF-8');
  // reset input so same file can be re-selected
  event.target.value = '';
}

function previewImport() {
  const text = document.getElementById('import-text').value;
  const parsed = parseCSVText(text);
  if (parsed.length === 0) {
    alert('有効なデータが見つかりませんでした。\n書式: 表,裏（1行1アイテム）');
    return;
  }
  importParsed = parsed;

  // Show preview
  document.getElementById('import-count-label').textContent = `${parsed.length}件`;
  document.getElementById('import-preview-list').innerHTML = parsed.map((r, i) => `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">
      <div style="font-weight:700;font-size:13px">${esc(r.front)}</div>
      ${r.back ? `<div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(r.back)}</div>` : '<div style="font-size:11px;color:var(--text3);margin-top:2px">（裏なし）</div>'}
    </div>`).join('');

  document.getElementById('import-step1').style.display = 'none';
  document.getElementById('import-step2').style.display = 'block';
  document.getElementById('import-tag').value = '';
  document.getElementById('scroll-area').scrollTop = 0;
}

function resetImport() {
  document.getElementById('import-step1').style.display = 'block';
  document.getElementById('import-step2').style.display = 'none';
  document.getElementById('import-step3').style.display = 'none';
  document.getElementById('import-text').value = '';
  importParsed = [];
  document.getElementById('scroll-area').scrollTop = 0;
}

function confirmImport() {
  const tag = document.getElementById('import-tag').value.trim();
  const now = Date.now();
  const newItems = importParsed.map((r, i) => ({
    id: (now + i).toString(),
    front: r.front,
    back: r.back,
    tag: tag,
    stage: 0,
    nextReview: null,
    completed: false,
    createdAt: todayStr(),
    lastReviewed: null,
  }));
  items.unshift(...newItems);
  save();
  updateBadges();

  document.getElementById('import-step2').style.display = 'none';
  document.getElementById('import-step3').style.display = 'block';
  document.getElementById('import-done-msg').textContent =
    `${newItems.length}件のアイテムを登録しました。${tag ? '「' + tag + '」カテゴリ' : 'カテゴリなし'}で追加されました。`;
  document.getElementById('scroll-area').scrollTop = 0;
}

function exportCSV() {
  if (!items.length) { alert('エクスポートするアイテムがありません。'); return; }
  const rows = [['表','裏'], ...items.map(i => [i.front, i.back||''])];
  const csv = rows.map(r => r.map(c => `"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadFile('remindo_export.csv', csv, 'text/csv;charset=utf-8;');
}

function exportJSON() {
  if (!items.length) { alert('エクスポートするアイテムがありません。'); return; }
  downloadFile('remindo_backup.json', JSON.stringify(items, null, 2), 'application/json');
}

function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.getElementById('modal-overlay').classList.contains('open')) saveItem();
  if(document.getElementById('page-review').classList.contains('active')){
    if((e.key===' '||e.key==='Enter')&&!reviewFlipped){e.preventDefault();flipCard();}
    if((e.key==='ArrowRight'||e.key==='y')&&reviewFlipped) answerReview(true);
    if((e.key==='ArrowLeft'||e.key==='n')&&reviewFlipped) answerReview(false);
    if(e.key==='Backspace'&&reviewFlipped) unflipCard();
  }
});

// Service Worker
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

// INIT
